appId: com.gphotos.desktop
productName: gPhotos Desktop
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: resources/models-onnx
    to: models-onnx
win:
  icon: public/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
