appId: com.gphotos.desktop
productName: gPhotos Desktop
# Windows' file-properties "File version"/"Product version" want all 4
# segments (major.minor.patch.build); package.json's version stays plain
# semver (three segments) for npm/electron-builder's own tooling.
buildVersion: 2.0.0.0
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: resources/models-onnx
    to: models-onnx
# electron-builder's automatic asar-unpack heuristic only unpacks a
# node_modules package if IT ITSELF contains a native .node binding. sharp's
# actual image-processing library (libvips) ships as a separate companion
# package (@img/sharp-libvips-<platform>-<arch>) with no .node file of its
# own — just a .so/.dylib the sharp binding dlopen()s at runtime — so it was
# silently left packed inside app.asar, where dlopen can't reach it (this
# is what broke sharp entirely on the Linux build: "cannot open shared
# object file"). Unpacking all of @img/** covers sharp on every platform.
asarUnpack:
  - "**/node_modules/@img/**"
  - "**/node_modules/onnxruntime-node/**"
  # Spawned via worker_threads (see faceDetectionWorkerClient.ts) to keep
  # ONNX inference off the main process's event loop. worker_threads.Worker
  # loading a script straight out of app.asar works on current Electron, but
  # unpacking this one small file removes any doubt/edge cases around it —
  # essentially free, since it's not a native binary.
  - "**/dist-electron/main/services/faceDetectionWorker.js"
win:
  icon: public/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
linux:
  icon: public/icon.png
  category: Graphics
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: ${productName}-${version}.${ext}
  maintainer: Sachin Bhavsar <claude.ssminfotech@gmail.com>
  compression: gz
