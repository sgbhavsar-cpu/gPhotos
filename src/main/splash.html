<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starting gPhotos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .splash-card {
      -webkit-app-region: drag;
      width: 440px;
      height: 270px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 30px rgba(59, 130, 246, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 28px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient background glow */
    .splash-card::before {
      content: '';
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 120px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(236, 72, 153, 0.15) 50%, transparent 80%);
      filter: blur(25px);
      pointer-events: none;
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 1;
    }

    /* Animated 4-Color Pinwheel Logo */
    .logo-container {
      position: relative;
      width: 60px;
      height: 60px;
      animation: gentle-spin 12s linear infinite;
    }

    .pinwheel-blade {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50% 50% 0 50%;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }

    .blade-red {
      top: 0;
      left: 4px;
      background: linear-gradient(135deg, #f87171, #ef4444);
      transform: rotate(0deg);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    .blade-yellow {
      top: 4px;
      right: 0;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      transform: rotate(90deg);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
    }

    .blade-green {
      bottom: 0;
      right: 4px;
      background: linear-gradient(135deg, #34d399, #10b981);
      transform: rotate(180deg);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    .blade-blue {
      bottom: 4px;
      left: 0;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      transform: rotate(270deg);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
    }

    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    @keyframes gentle-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 400;
    }

    /* Progress and Status Area */
    .status-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1;
    }

    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
      animation: shimmer-progress 1.6s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
    }

    @keyframes shimmer-progress {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 55%;
      }
      100% {
        left: 105%;
        width: 30%;
      }
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .status-text {
      color: #cbd5e1;
      font-weight: 500;
      transition: opacity 0.3s ease;
    }

    .dots {
      display: inline-block;
      width: 16px;
      text-align: left;
    }

    .version-tag {
      color: #64748b;
      font-family: monospace;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="brand-section">
      <div class="logo-container">
        <div class="pinwheel-blade blade-red"></div>
        <div class="pinwheel-blade blade-yellow"></div>
        <div class="pinwheel-blade blade-green"></div>
        <div class="pinwheel-blade blade-blue"></div>
        <div class="center-dot"></div>
      </div>
      <div class="title-row">
        <span class="title-text">gPhotos</span>
        <span class="badge">Desktop Edition</span>
      </div>
      <span class="subtitle">Standalone Windows Photo Manager</span>
    </div>

    <div class="status-section">
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="status-row">
        <span class="status-text" id="status-label">Starting background services and library<span class="dots" id="dots">...</span></span>
        <span class="version-tag">v1.0.0</span>
      </div>
    </div>
  </div>

  <script>
    // Cycle informative status messages during startup
    const messages = [
      'Starting background services and library...',
      'Synchronizing photo catalog...',
      'Preparing high-speed workspace...',
      'Ready!'
    ];
    let msgIdx = 0;
    const label = document.getElementById('status-label');
    setInterval(() => {
      msgIdx = (msgIdx + 1) % (messages.length - 1);
      if (label) {
        label.style.opacity = '0';
        setTimeout(() => {
          label.innerText = messages[msgIdx];
          label.style.opacity = '1';
        }, 200);
      }
    }, 1200);
  </script>
</body>
</html>
